services:
  - type: web
    name: paka-poker-api
    runtime: node
    rootDir: PAKA-POKER-16-3D/server
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: paka-poker-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://paka-poker-api.onrender.com/api/mpesa/callback
databases:
  - name: paka-poker-db
    databaseName: paka_poker
    user: paka_poker
