permissions:
  contents: write

name: PAKA POWER 16 3D checks

on:
  push:
    branches: [main]
    paths:
      - 'PAKA-POKER-16-3D/client/**'
      - 'PAKA-POKER-16-3D/server/**'
      - 'PAKA-POKER-16-3D/android/**'
      - 'PAKA-POKER-16-3D/capacitor.config.ts'
      - 'PAKA-POKER-16-3D/render.yaml'
      - 'PAKA-POKER-16-3D/docs/**'
      - '.github/workflows/paka-auth-checks.yml'
  pull_request:
    paths:
      - 'PAKA-POKER-16-3D/client/**'
      - 'PAKA-POKER-16-3D/server/**'
      - '.github/workflows/paka-auth-checks.yml'

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PAKA-POKER-16-3D/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PAKA-POKER-16-3D/server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PAKA-POKER-16-3D/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PAKA-POKER-16-3D/client/package-lock.json
      - run: npm ci
      - run: npm run build

  live-backend-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - name: Verify live API health and retired M-PESA routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://paka-poker-api.onrender.com"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$base_url/health" -o /tmp/paka-health.json
          status="$(curl --silent --show-error -o /tmp/paka-mpesa.json -w "%{http_code}" "$base_url/api/mpesa")"
          if [[ "$status" != "404" ]]; then
            echo "Expected retired /api/mpesa endpoint to return 404; received $status"
            cat /tmp/paka-mpesa.json
            exit 1
          fi
          echo "Live health endpoint responded successfully."
          cat /tmp/paka-health.json
          echo "Retired /api/mpesa endpoint returned 404 as expected."

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PAKA-POKER-16-3D/client/package-lock.json
      - name: Build PAKA POWER 16 3D web app
        working-directory: PAKA-POKER-16-3D/client
        run: |
          npm ci
          npm run build
      - name: Publish tested web build to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: PAKA-POKER-16-3D/client/dist
